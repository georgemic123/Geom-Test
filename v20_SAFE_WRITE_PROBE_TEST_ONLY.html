<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v20 Storage Write Probe</title><style>body{font:16px system-ui;background:#101a30;color:#e8f1ff;padding:22px;line-height:1.6}button{background:#22c6a6;border:0;border-radius:10px;padding:14px 20px;font-weight:bold;font-size:17px}pre{white-space:pre-wrap;background:#1d2b45;padding:15px;border-radius:10px}</style></head><body><h2>v20 — Ασφαλής δοκιμή αποθήκευσης</h2><p>Διαβάζει μόνο τον αριθμό πραγματικών στοιχημάτων. Με το κουμπί γράφει μια μικρή προσωρινή τιμή σε <b>νέο, ξεχωριστό κλειδί</b>, την ελέγχει και την αφαιρεί. Δεν τροποποιεί κανένα στοίχημα ή φίλτρο.</p><pre id="out">Φόρτωση…</pre><button id="go">Έλεγχος αποθήκευσης</button><script>(function(){'use strict';const o=document.getElementById('out');const k='__BA_V20_WRITE_PROBE_ONLY__';function show(s){o.textContent=s}let count='δεν διαβάστηκε';try{let a=JSON.parse(localStorage.getItem('ba_dual_bets_prop_v1')||'[]');count=Array.isArray(a)?a.length:'μη έγκυρη λίστα'}catch(e){count='σφάλμα ανάγνωσης'}show('Στοιχήματα v19: '+count+'\nΚαμία εγγραφή δεν έχει πραγματοποιηθεί.');document.getElementById('go').onclick=function(){let before;try{before=localStorage.getItem(k);if(before!==null){show('STOP: Το δοκιμαστικό κλειδί υπάρχει ήδη. Δεν το αγγίζουμε.');return}const token='probe-'+Date.now()+'-'+Math.random().toString(36).slice(2);localStorage.setItem(k,token);const ok=localStorage.getItem(k)===token;localStorage.removeItem(k);const removed=localStorage.getItem(k)===null;show('Στοιχήματα v19: '+count+'\nΕγγραφή και ανάγνωση: '+(ok?'OK':'ΑΠΟΤΥΧΙΑ')+'\nΚαθαρισμός προσωρινού κλειδιού: '+(removed?'OK':'ΑΠΟΤΥΧΙΑ')+'\nΤα δεδομένα των στοιχημάτων δεν τροποποιήθηκαν από αυτόν τον έλεγχο.')}catch(e){try{if(before===null)localStorage.removeItem(k)}catch(_){}show('ΑΠΟΤΥΧΙΑ εγγραφής: '+e.name+' — '+e.message+'\nΔεν έγινε αλλαγή σε στοιχήματα.')}}})();</script></body></html>
